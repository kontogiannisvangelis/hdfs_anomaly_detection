[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hdfs-lad"
version = "0.1.0"
description = "HDFS LAD project"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "datasets",
  "evaluate",
  "scikit-learn",
  "peft",
  "transformers",
  "pyyaml",
  "pandas",
  "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["hdfs_lad"]
